# R5 roadmap item: CI gate for the lumiport absorption.
# Runs exactly the three verification commands documented in
# lumiport/HANDOFF.md §2.5 so any regression to the absorbed code fails CI.
name: Lumiport Absorption Gate

env:
  GO_VERSION: '1.26.5'

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/packages/lumicore/**"
      - "src/apps/daemon/internal/networking/dns/**"
      - "src/apps/daemon/internal/analysis/diagnostics/**"
      - "src/apps/daemon/internal/integrations/sub/**"

jobs:
  absorption-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lumicore full test suite
        working-directory: src/packages/lumicore
        run: cargo test --lib

      - name: Daemon build
        working-directory: src/apps/daemon
        run: go build ./internal/... ./cmd/...

      - name: Daemon DNS suite
        working-directory: src/apps/daemon
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/networking/dns/ ./internal/analysis/diagnostics/ ./internal/integrations/sub/

      - name: Tag check
        run: |
          echo "Gate: lumiport-absorption-complete baseline must stay green."
          echo "Baseline: 590 lumicore lib tests; daemon dns/diagnostics/sub suites pass."
